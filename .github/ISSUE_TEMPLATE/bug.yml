name: Bug Report
description: Create a bug report
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

        If you believe you have found a vulnerability, please provide details [here](mailto:security@selemis.com) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: |
        A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Please provide any steps you think might be relevant to reproduce the bug.
      placeholder: |
        Steps to reproduce:

        1. Start '...'
        2. Then '...'
        3. Check '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If applicable, please provide the logs leading up to the bug.
      render: text
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      description: What platform(s) did this occur on?
      multiple: true
      options:
        - Linux (x86)
        - Linux (ARM)
        - Mac (Intel)
        - Mac (Apple Silicon)
        - Windows (x86)
        - Windows (ARM)
  - type: dropdown
    id: container_type
    attributes:
      label: Container Type
      description: Were you running it in a container?
      multiple: true
      options:
        - Not running in a container
        - Docker
        - Kubernetes
        - Other
    validations:
      required: true
  - type: input
    id: steda-version
    attributes:
      label: Steda version or commit
      placeholder: 0.1.0 or a git commit SHA
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
      placeholder: rustc 1.95.0 (...)
    validations:
      required: true
  - type: input
    id: postgres-version
    attributes:
      label: PostgreSQL version
      description: Output of `SELECT version();` or `postgres --version`.
      placeholder: PostgreSQL 18.x
    validations:
      required: true
